[package]
name = "tauri-plugin-window-state"
version = "2.5.0"
edition = "2024"
rust-version = "1.90"
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/plugins-workspace"
description = "Window geometry with an explicit state file"
links = "tauri-plugin-window-state"
publish = false

[workspace]
resolver = "3"

[dependencies]
bitflags = "=2.13.2"
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", default-features = false }
thiserror = "=2.0.21"

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }
