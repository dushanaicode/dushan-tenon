[workspace]
members = ["crates/framework", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-build = "2.7"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
keyring = { version = "3.6", default-features = false }
moka = { version = "0.12", features = ["future"] }
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script", "tls-rustls-insecure"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "ansi"] }
ts-rs = "12"
uuid = { version = "1", default-features = false, features = ["std", "v4", "v7"] }
