[workspace]
members = ["crates/*", "src-tauri"]
exclude = ["vendor/calamine", "vendor/tauri-plugin-window-state"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
ab_glyph = "0.2.32"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
base64 = "0.22"
calamine = { path = "vendor/calamine", version = "0.36.1", default-features = false }
clap = { version = "4.6", features = ["derive"] }
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
csv = "1.4.0"
getrandom = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
keyring = { version = "3.6", default-features = false }
moka = { version = "0.12", features = ["future"] }
png = "0.18"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script", "tls-rustls-insecure"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rust_xlsxwriter = { version = "0.99.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
sea-query = { version = "1.0", default-features = false, features = ["backend-sqlite", "backend-mysql", "backend-postgres", "thread-safe"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "mysql-rsa", "postgres", "derive", "tls-rustls-ring-native-roots"] }
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon", "image-png"] }
tauri-build = "2.7"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-window-state = { path = "vendor/tauri-plugin-window-state" }
tauri-plugin-notification = "2.5.1"
tauri-plugin-single-instance = "2"
tempfile = "3.23"
tenon-desktop = { path = "crates/desktop" }
tenon-framework = { path = "crates/framework" }
tenon-module-account = { path = "crates/module-account" }
tenon-module-ai = { path = "crates/module-ai" }
tenon-module-demo = { path = "crates/module-demo" }
tenon-module-devtools = { path = "crates/module-devtools" }
tenon-module-files = { path = "crates/module-files" }
tenon-module-notify = { path = "crates/module-notify" }
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
tokio-util = "0.7"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "ansi"] }
ts-rs = "12"
uuid = { version = "1", default-features = false, features = ["std", "v4", "v7"] }
windows-registry = "=0.6.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
