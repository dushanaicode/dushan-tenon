# 新状态目录的配置种子，复制为 <状态目录>/config.toml。
# pnpm preset full；已有配置文件时 pnpm preset 会拒绝。
[auth]
mode = "login"

[window]
restore_state = true
titlebar = "hidden"
close_action = "ask"

[tray]
enabled = true

[modules.account]
enabled = true

[modules.notify]
enabled = true

[modules.files]
enabled = true

[modules.devtools]
enabled = true

[ui]
language = "zh-CN"
theme = "system"
developer_mode = false

[autostart]
enabled = false

[shortcuts]
show_main = ""

[network]
proxy_mode = "direct"
proxy_endpoint = ""
proxy_auth = false

[modules.demo]
enabled = true
[updater]
check_on_start = false
