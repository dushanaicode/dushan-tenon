name: 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这是一个单人桌面工具的底座，范围见 README 的“适合谁用，不适合谁”。先搜索已有的 Issue，避免重复。
        This is a foundation for single-user desktop tools; see "Who it is for, and who it is not for" in the README for its scope. Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: |
        你遇到了什么情况，现在缺了什么。
        What situation you are in and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法 / Alternatives considered
  - type: checkboxes
    id: pr
    attributes:
      label: 参与 / Contributing
      options:
        - label: 我愿意在商量好之后自己提 PR / I am willing to open a pull request once we agree on the approach
