name: Sync to Gitee

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dushanaicode/dushan-tenon' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push main and release tags to Gitee
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$PWD/Temp/gitee-sync"
          export TEMP="$TMPDIR" TMP="$TMPDIR"
          mkdir -p "$TMPDIR"
          test -n "$GITEE_SSH_PRIVATE_KEY" || { echo '::error::Missing GITEE_SSH_PRIVATE_KEY'; exit 1; }
          trap 'rm -f "$TMPDIR/key"' EXIT
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > "$TMPDIR/key"
          printf '%s\n' 'gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN' > "$TMPDIR/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $TMPDIR/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$TMPDIR/known_hosts -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" clone --bare https://github.com/dushanaicode/dushan-tenon.git "$TMPDIR/repository.git"
          git -C "$TMPDIR/repository.git" push git@gitee.com:dushan-ai/dushan-tenon.git 'refs/heads/main:refs/heads/main' 'refs/tags/v*:refs/tags/v*'
          expected_main="$(git -C "$TMPDIR/repository.git" rev-parse refs/heads/main)"
          actual_main="$(git ls-remote git@gitee.com:dushan-ai/dushan-tenon.git refs/heads/main | cut -f1)"
          test "$actual_main" = "$expected_main"
          printf 'Verified Gitee main: %s\n' "$actual_main"
          git ls-remote --symref git@gitee.com:dushan-ai/dushan-tenon.git HEAD
