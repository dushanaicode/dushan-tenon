name: Check

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows runners are billed on private repositories; the check runs once the repository is public.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Same isolated environment as local automation: caches and temporary files stay under Temp/.
      - name: Load the isolated environment
        shell: pwsh
        run: |
          $isolated = node scripts/environment.mjs | ConvertFrom-Json
          foreach ($item in $isolated.PSObject.Properties) {
            "$($item.Name)=$($item.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Temp/cargo-home/registry
            Temp/cargo-home/git
            Temp/cargo-target
            Temp/corepack
            Temp/pnpm-store
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'rust-toolchain.toml') }}
          restore-keys: check-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: pnpm check
        shell: pwsh
        run: pnpm check

      - name: pnpm test
        shell: pwsh
        run: pnpm test
